# ── SigeDash — nginx reverse proxy ────────────────────────────────────────────
# Coloque os certificados SSL em nginx/certs/:
#   fullchain.pem  — certificado + cadeia (Let's Encrypt ou outro)
#   privkey.pem    — chave privada
#
# Para obter certificados gratuitos com Let's Encrypt (na primeira vez):
#   docker run --rm -p 80:80 \
#     -v $(pwd)/nginx/certs:/etc/letsencrypt/live/dash.sigedash.com.br \
#     certbot/certbot certonly --standalone \
#     -d dash.sigedash.com.br --agree-tos -m seu@email.com
# ------------------------------------------------------------------------------

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name dash.sigedash.com.br;
    return 301 https://$host$request_uri;
}

# ── Ranges oficiais do Cloudflare ─────────────────────────────────────────────
# Restaura o IP real do visitante (vem no header CF-Connecting-IP) e, no bloco 443,
# so aceita conexoes vindas do Cloudflare (allow ... ; deny all). Isso impede que
# alguem descubra o IP de origem e ataque o nginx direto, contornando o WAF/DDoS da CF.
# Fonte: https://www.cloudflare.com/ips/  (atualizar se a CF publicar novos ranges).
# IPv4:
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6:
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTPS principal
server {
    listen 443 ssl;
    server_name dash.sigedash.com.br;

    # So aceita trafego do Cloudflare (senao 403). Alternativa mais forte: Authenticated
    # Origin Pulls (mTLS). Libere redes privadas apenas se precisar de health-check local.
    allow 173.245.48.0/20;   allow 103.21.244.0/22;  allow 103.22.200.0/22;
    allow 103.31.4.0/22;     allow 141.101.64.0/18;  allow 108.162.192.0/18;
    allow 190.93.240.0/20;   allow 188.114.96.0/20;  allow 197.234.240.0/22;
    allow 198.41.128.0/17;   allow 162.158.0.0/15;   allow 104.16.0.0/13;
    allow 104.24.0.0/14;     allow 172.64.0.0/13;    allow 131.0.72.0/22;
    allow 2400:cb00::/32;    allow 2606:4700::/32;    allow 2803:f800::/32;
    allow 2405:b500::/32;    allow 2405:8100::/32;    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Compressão (PWA + API JSON)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Proxy para o backend .NET (porta interna 8080)
    location / {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
